name = "umay-social-automation"
main = "src/worker.js"
compatibility_date = "2026-11-24"

[triggers]
crons = ["*/15 * * * *"]
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "umay-social-db"
database_id = "1190e781-c81e-486d-bf84-7db86dd47648"
[ai]
binding = "AI"
